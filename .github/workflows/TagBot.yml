name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  Setup-matrix:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build library matrix from .github/library-label.json
        id: set-matrix
        run: |
          matrix=$(jq -c '[to_entries[] | {name: .key, label: .value}]' .github/library-label.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  TagBot-libraries:
    needs: Setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJSON(needs.Setup-matrix.outputs.matrix) }}
    steps:
      - name: Tag ${{ matrix.library.name }}.jl
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: lib/${{ matrix.library.name }}
          changelog: | # the changelog will only gather merged PRs and closed issues that have the matching label (see .github/library-label.json)
            ## {{ version }}

            {% if previous_release %}
            [Diff since {{ previous_release }}]({{ compare_url }})
            {% endif %}

            {% if custom %}
            {{ custom }}
            {% endif %}

            {% set ns = namespace(pulls=[], issues=[]) %}
            {% for pull in pulls if "${{ matrix.library.label }}" in pull.labels %}
            {% set ns.pulls = ns.pulls + [pull] %}
            {% endfor %}
            {% for issue in issues if "${{ matrix.library.label }}" in issue.labels %}
            {% set ns.issues = ns.issues + [issue] %}
            {% endfor %}

            {% if ns.pulls %}
            **Merged pull requests:**
            {% for pull in ns.pulls %}
            - {{ pull.title }} (#{{ pull.number }}) (@{{ pull.author.username }})
            {% endfor %}
            {% endif %}

            {% if ns.issues %}
            **Closed issues:**
            {% for issue in ns.issues %}
            - {{ issue.title }} (#{{ issue.number }})
            {% endfor %}
            {% endif %}

  TagBot-main: # QuantumToolbox.jl
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      # the changelog for the main package will use the default one, which gathers all merged PRs and closed issues, regardless of labels
      - name: Tag QuantumToolbox.jl
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          tag_prefix: NO_PREFIX

  Set-latest:
    needs: [TagBot-libraries, TagBot-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set main package tag as Latest # e.g., vX.Y.Z, so that the latest release is always the latest tag of the main package, not the subpackages
        run: |
          git fetch --tags --force
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          echo "Latest tag: $tag"
          gh release edit "$tag" --repo ${{ github.repository }} --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
