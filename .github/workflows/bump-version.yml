name: Bump Version

on:
  workflow_dispatch:
    inputs:
      QuantumToolbox:
        description: 'Bump version for QuantumToolbox'
        required: true
        default: 'no'
        type: choice
        options:
        - no
        - patch
        - minor
        - major
      QuantumToolboxCore:
        description: 'Bump version for QuantumToolboxCore'
        required: true
        default: 'no'
        type: choice
        options:
        - no
        - patch
        - minor
        - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Calculate new versions & Update Project.toml files
        id: updates
        run: |
          # We use a quick inline Julia script to parse and increment the versions
          # This ensures we handle Semantic Versioning correctly
          julia -e '
            using Pkg; Pkg.add("JSON")
            using TOML, Dates, JSON

            project_file(package) = package == "QuantumToolbox" ? "Project.toml" : "lib/$(package)/Project.toml"

            function bump(v::VersionNumber, type::AbstractString)
              type == "major" && return VersionNumber(v.major + 1, 0, 0)
              type == "minor" && return VersionNumber(v.major, v.minor + 1, 0)
              type == "patch" && return VersionNumber(v.major, v.minor, v.patch + 1)
              throw(ArgumentError("Invalid bump version type: $type"))
            end

            # handle input BUMPS
            BUMPS = JSON.parse(ENV["BUMPS"])
            package_list = String[k for (k, v) in BUMPS if v != "no"]
            isempty(package_list) && error("Every package is set to `no`. Select a bump version type for at least one package.")

            old_QT_version = TOML.parsefile("Project.toml")["version"]
            old_versions = Dict{String,VersionNumber}()
            new_versions = Dict{String,VersionNumber}()
            changed_files = String[]

            for pkg in package_list
              file = project_file(pkg)
              v = VersionNumber(TOML.parsefile(file)["version"])
              new_v = bump(v, BUMPS[pkg])
              old_versions[pkg] = v
              new_versions[pkg] = new_v

              # update Project.toml (using Regex to preserve formatting)
              content = read(file, String)
              write(file, replace(content, r"version = \".*\"" => "version = \"$new_v\""))
              push!(changed_files, file)
              println("Bump $pkg version from v$v to v$new_v: updated $file")
            end

            branch = "bump-version-" * Dates.format(now(), "yyyymmdd")
            title = "Bump " * join(["$pkg to v$(new_versions[pkg])" for pkg in package_list], ", ")
            body = "This PR bumps the version(s) for the following package(s) and updates CHANGELOG:\n\n" * join(["- $pkg: v$(old_versions[pkg]) -> v$(new_versions[pkg])" for pkg in package_list], "\n")

            open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "branch_name=$branch")
              println(io, "pr_title=$title")
              println(io, "pr_body=$body")
              println(io, "changed_files=$(join(changed_files, " "))")
              println(io, "old_QT_version=$old_QT_version")
              println(io, "new_versions=$(JSON.json(new_versions))")
            end
          '
        env:
          BUMPS: ${{ toJSON(inputs) }}

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.updates.outputs.branch_name }}
          PR_TITLE: ${{ steps.updates.outputs.pr_title }}
          PR_BODY: ${{ steps.updates.outputs.pr_body }}
          CHANGED_FILES: ${{ steps.updates.outputs.changed_files }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add $CHANGED_FILES
          git commit -m "[no ci] Bump version numbers"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY")

          PR_NUMBER="${PR_URL##*/}"

          echo "Created PR: $PR_URL"
          {
            echo "pr_url=$PR_URL"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        env:
          BRANCH_NAME: ${{ steps.updates.outputs.branch_name }}
          OLD_QT_VERSION: ${{ steps.updates.outputs.old_QT_version }}
          NEW_VERSIONS: ${{ steps.updates.outputs.new_versions }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          julia -e '
            using Pkg; Pkg.add(["Changelog", "JSON"])
            using Dates, Changelog, JSON

            new_versions = JSON.parse(ENV["NEW_VERSIONS"])
            v_QT = ENV["OLD_QT_VERSION"]
            pr_number = ENV["PR_NUMBER"]
            package_list = collect(keys(new_versions))

            # get changelog file and content
            changelog_file = "CHANGELOG.md"
            content = read(changelog_file, String)

            # changelog for all libraries except QuantumToolbox
            for pkg in package_list
              if pkg != "QuantumToolbox"
                new_v = new_versions[pkg]
                marker = "\n\n## [v$v_QT]"
                insertion = "\n- [lib] Bump `$pkg` version to `v$new_v`. ([#$pr_number])\n$marker"
                content = replace(content, marker => insertion)
              end
            end

            # changelog for QuantumToolbox (must be updated after libraries)
            if "QuantumToolbox" in package_list
              new_v = new_versions["QuantumToolbox"]
              marker = "## [Unreleased](https://github.com/qutip/QuantumToolbox.jl/tree/main)"
              insertion = "$marker\n\n\n\n## [v$new_v]\nRelease date: $(Dates.format(now(), "yyyy-mm-dd"))"
              content = replace(content, marker => insertion)
            end

            # write CHANGELOG.md
            write(changelog_file, content)
            Changelog.generate(Changelog.CommonMark(), changelog_file; repo = "qutip/QuantumToolbox.jl")
            println("Updated $changelog_file")
          '

          git add CHANGELOG.md
          git commit -m "[no ci] Update CHANGELOG"
          git push origin "$BRANCH_NAME"
